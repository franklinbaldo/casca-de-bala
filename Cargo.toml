[package]
name = "band7-terminal"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Android basic BLE reader and experimental offline terminal core for Xiaomi Smart Band 7"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[lib]
crate-type = ["rlib", "cdylib"]
