plugins { id 'com.android.application' }
android {
    namespace 'org.workspace.band7.spike'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.workspace.band7.spike.btleplug'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName 'spike-btleplug-1'
        ndk { abiFilters 'arm64-v8a' }
    }
    // btleplug's own Java half (droidplug + vendored jni-utils), straight from the crate.
    def btleplugJava = providers.gradleProperty('btleplugJava')
    if (btleplugJava.isPresent()) sourceSets.main.java.srcDirs += [btleplugJava.get()]
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
