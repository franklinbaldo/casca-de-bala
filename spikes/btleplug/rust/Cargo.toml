[package]
name = "casca-spike-btleplug"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

# Standalone spike: not part of the main workspace or the Casca APK.
[workspace]

[lib]
name = "casca_spike"
crate-type = ["cdylib"]

[dependencies]
btleplug = { version = "=0.13.5", features = ["serde"] }
jni = "=0.22.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
