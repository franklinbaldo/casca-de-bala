# Fast local feedback. CI remains authoritative for Android JNI/APK and release.
default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--locked", "--offline", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--locked", "--offline"]
need_stdout = true

[jobs.fmt]
command = ["cargo", "fmt", "--all", "--", "--check"]
need_stdout = true
