[package]
name = "casca-ble"
description = "Bluetooth LE lab worker driven from Rust (btleplug + JNI) on Android; empty elsewhere"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

# Android only: on Linux hosts btleplug would pull BlueZ/D-Bus into every build.
[target.'cfg(target_os = "android")'.dependencies]
btleplug = { version = "=0.13.5", features = ["serde"] }
casca-mcp.workspace = true
futures = "0.3"
jni = "=0.22.4"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"
