Name: Casca de Bala
Summary: Gadgetbridge com um hub MCP para as suas IAs
Description: |-
  O Casca é o Gadgetbridge (https://gadgetbridge.org), com o mesmo suporte a pulseiras e
  relógios, mais um servidor MCP que deixa as suas IAs usarem esses aparelhos pelo celular.

  * Pareie a pulseira na tela do Gadgetbridge (a Xiaomi Smart Band 7 precisa da chave de autenticação).
  * Em "Casca MCP", ligue o servidor: ele escuta no próprio celular e na sua tailnet (Tailscale).
  * Cada IA pede acesso e você aprova o código numa notificação; ajustes que mudam o aparelho pedem nova aprovação.
  * As IAs listam os aparelhos, mandam mensagens ao pulso, fazem a pulseira vibrar e pedem sincronização.

  Baseado no Gadgetbridge (AGPL-3.0-or-later). Não é o app oficial do Gadgetbridge.
