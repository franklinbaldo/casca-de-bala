plugins { id 'java-library' }
// Plain Java, no Android APIs: the host harnesses in tests/ run via test.sh.
sourceSets {
    main.java.srcDirs = ['src']
    test.java.srcDirs = []
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:all,-options', '-Werror'] }
