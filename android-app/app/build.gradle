plugins { id 'com.android.application' }
def legalAssets = layout.buildDirectory.dir('generated/legal-assets').get().asFile
android {
    namespace 'org.workspace.band7.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.workspace.band7.basicreader'
        minSdk 31
        targetSdk 35
        def ciCode = providers.gradleProperty('cascaVersionCode').orElse('5').get()
        def ciName = providers.gradleProperty('cascaVersionName').orElse('0.5-lab').get()
        if (!(ciCode ==~ /[1-9][0-9]*/) || ciCode.toBigInteger() > 2100000000)
            throw new GradleException('Invalid cascaVersionCode')
        if (!(ciName ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,79}/))
            throw new GradleException('Invalid cascaVersionName')
        versionCode ciCode.toInteger()
        versionName ciName
        ndk { abiFilters 'arm64-v8a' }
    }
    // Legal texts ship from their single source in the repository root.
    sourceSets.main.assets.srcDirs += ['../../docs/licenses', '../../third_party', legalAssets]
    // btleplug's Java half, copied from the locked crate by build-native.sh; JNI-only, never minified.
    sourceSets.main.java.srcDirs += ['generated/btleplug-java']
    lint { lintConfig = file('lint.xml') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Standard debug signing, but callers can confine the temporary key to a
    // private build directory and delete it afterward. No production signing.
    signingConfigs.debug {
        if (providers.gradleProperty('band7DebugKeystore').isPresent())
            storeFile = file(providers.gradleProperty('band7DebugKeystore').get())
    }
}
tasks.register('checkNativeInputs') {
    doLast {
        ['libband7_terminal.so','libband7_jni.so'].each { name ->
            if (!file("src/main/jniLibs/arm64-v8a/$name").isFile())
                throw new GradleException("Missing $name; run sh build-native.sh with approved NDK/target first")
        }
        if (!file('generated/btleplug-java/com/nonpolynomial/btleplug/android/impl/Adapter.java').isFile())
            throw new GradleException('Missing btleplug Java sources; run sh build-native.sh first')
    }
}
tasks.register('copyLegalAssets', Copy) {
    from('../../NOTICE') { rename { 'NOTICE.txt' } }
    from('../../PROVENANCE.md') { rename { 'PROVENANCE.txt' } }
    into legalAssets
}
// Reuse JNI/core contracts; no AndroidX, networking or copied decoder.
dependencies { implementation project(':bridge') }
tasks.named('preBuild').configure { dependsOn 'checkNativeInputs', 'copyLegalAssets' }
